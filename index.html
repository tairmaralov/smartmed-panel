<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отчёты SmartMed</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;padding:14px;
     background:var(--tg-theme-bg-color,#f6f7f9);color:var(--tg-theme-text-color,#1c2733)}
h1{font-size:19px;margin:4px 0 12px}
.card{background:var(--tg-theme-secondary-bg-color,#fff);border:1px solid rgba(128,128,128,.25);
      border-radius:12px;padding:12px 14px;margin:0 0 10px}
.card h2{font-size:15px;margin:0 0 3px}
.note{color:var(--tg-theme-hint-color,#5b6b7b);font-size:12px;margin:0 0 8px}
select,input{display:block;width:100%;box-sizing:border-box;padding:9px 10px;margin:0 0 8px;
             border:1px solid rgba(128,128,128,.35);border-radius:8px;font-size:15px;
             background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#1c2733)}
.two{display:flex;gap:8px}
.two input{margin-bottom:8px;min-width:0}
.fixed{font-size:13px;color:var(--tg-theme-hint-color,#5b6b7b);margin:0 0 6px}
.hint{font-size:12px;color:var(--tg-theme-hint-color,#5b6b7b);margin:2px 0 4px}
button{background:var(--tg-theme-button-color,#1f4e78);color:var(--tg-theme-button-text-color,#fff);
       border:0;border-radius:8px;padding:11px 16px;font-size:15px;cursor:pointer;display:block;
       width:100%;box-sizing:border-box}
.warn{background:#fff2cc;border:1px solid #e3cf7a;border-radius:10px;padding:10px 12px;
      font-size:13px;color:#5b4a12;margin-bottom:12px;display:none}
.foot{color:var(--tg-theme-hint-color,#8492a0);font-size:11px;margin-top:14px}
label{font-size:13px}
</style>
</head>
<body>
<h1>📊 Отчёты SmartMed</h1>
<div class="warn" id="warn">Страница открыта вне Telegram — кнопки не сработают.
Откройте её кнопкой «Открыть панель» в чате с ботом отчётов.</div>
<div id="cards"></div>
<p class="foot">Файл придёт в этот же чат. Отчёты «воронка», «качество переписок» и провалы
с AI-вердиктами — по запросу Клоду. Компьютер должен быть включён.</p>
<script>
const MONTHS=["январь","февраль","март","апрель","май","июнь",
              "июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const DIRS={smartmed:"СмартМед",smartlab:"СмартЛаб",allergolab:"Аллерголаб",invitro:"InvitroGO"};
const REPORTS=[
 {key:"stage_errors",title:"🟢 Ошибки стадий продаж",
  note:"продажи дня/периода: кто не доведён до продающей стадии, поимённо (~2 мин, данные обновляются на момент запроса)",
  dirs:["smartmed"],params:"range"},
 {key:"daily",title:"🟢 Сводка дня по источникам",
  note:"то же, что приходит в 13:00/22:00, внеочередной прогон (~2 мин)",
  dirs:["smartmed"],params:null},
 {key:"istochnik",title:"🟢 Отчёт по источникам (месяц или период)",
  note:"продажи, стадии, отчёт об ошибках (~10–20 мин, данные обновляются на момент запроса)",
  dirs:["smartmed","smartlab","allergolab"],params:"month_or_range"},
 {key:"sales",title:"🟢 Отчёт по продажам (воронка + переписки)",
  note:"лестница ступеней за период + файл всех переписок; полный разбор переходов — по запросу Клоду (~2–5 мин на день)",
  dirs:["smartmed","invitro"],params:"range"},
 {key:"stale",title:"Остывшие лиды",
  note:"кто лежит без движения, снимок на сейчас (~1–3 мин)",
  dirs:["smartmed","smartlab","allergolab"],params:null},
 {key:"konv_dni",title:"🟢 Конверсия по дням и каналам",
  note:"лиды CRM + продажи менеджеров + конверсия, по дням месяца и каналам; листы СмартМед и СмартЛаб (~3–5 мин)",
  dirs:["smartmed"],params:"month"},
 {key:"conv",title:"Конверсия менеджеров",
  note:"лиды/продажи/конверсия по менеджерам за месяц (~3–5 мин)",
  dirs:["smartmed"],params:"month"},
 {key:"fails",title:"Ошибки в провалах",
  note:"провалы периода: причины, переписки, звонки; без AI-вердиктов (~5–10 мин)",
  dirs:["smartmed"],params:"range"},
];
const tg=window.Telegram&&window.Telegram.WebApp;
// признак «внутри Telegram»: платформа задана. initData у приложений,
// открытых кнопкой клавиатуры, ПУСТОЙ — это норма, sendData всё равно работает.
const inTg=!!(tg&&tg.platform&&tg.platform!=="unknown");
if(!inTg){document.getElementById("warn").style.display="block";}
if(tg){tg.ready();tg.expand();}

function monthOptions(){
  const now=new Date();let html="";
  for(let i=0;i<6;i++){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const v=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    html+=`<option value="${v}">${MONTHS[d.getMonth()]} ${d.getFullYear()}</option>`;
  }
  return html;
}
function isoShift(days){const d=new Date(Date.now()+days*86400000);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

const cards=document.getElementById("cards");
REPORTS.forEach(r=>{
  const div=document.createElement("div");div.className="card";
  let controls="";
  if(r.dirs.length>1){
    controls+=`<select id="dir_${r.key}">`+r.dirs.map(d=>`<option value="${d}">${DIRS[d]}</option>`).join("")+`</select>`;
  } else {
    controls+=`<div class="fixed">${DIRS[r.dirs[0]]}</div>`;
  }
  if(r.params==="month") controls+=`<select id="month_${r.key}">${monthOptions()}</select>`;
  if(r.params==="range") controls+=`<div class="hint">Период (с — по):</div>
    <div class="two"><input type="date" id="from_${r.key}" value="${isoShift(-1)}">
    <input type="date" id="to_${r.key}" value="${isoShift(-1)}"></div>`;
  if(r.params==="month_or_range") controls+=`<select id="month_${r.key}">${monthOptions()}</select>
    <div class="hint">…или свой период — заполните обе даты:</div>
    <div class="two"><input type="date" id="from_${r.key}"><input type="date" id="to_${r.key}"></div>`;
  div.innerHTML=`<h2>${r.title}</h2><p class="note">${r.note}</p>${controls}
                 <button onclick="run('${r.key}')">Получить в Telegram</button>`;
  cards.appendChild(div);
});

function run(key){
  const r=REPORTS.find(x=>x.key===key);
  const payload={report:key};
  payload.dir=r.dirs.length>1?document.getElementById("dir_"+key).value:r.dirs[0];
  if(r.params==="month") payload.month=document.getElementById("month_"+key).value;
  if(r.params==="month_or_range"){
    const f=document.getElementById("from_"+key).value, t=document.getElementById("to_"+key).value;
    if(f&&t){payload.from=f<t?f:t;payload.to=f<t?t:f;}
    else payload.month=document.getElementById("month_"+key).value;
  }
  if(r.params==="range"){
    payload.from=document.getElementById("from_"+key).value;
    payload.to=document.getElementById("to_"+key).value;
    if(!payload.from||!payload.to){alert("Выберите даты");return;}
    if(payload.from>payload.to){const t=payload.from;payload.from=payload.to;payload.to=t;}
  }
  if(inTg){tg.sendData(JSON.stringify(payload));}
  else{alert("Откройте страницу через кнопку в Telegram-боте");}
}
</script>
</body>
</html>
